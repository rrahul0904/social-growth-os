name: LoopLift CI

on:
  pull_request:
    paths:
      - "experiments/looplift/**"
      - ".github/workflows/looplift-ci.yml"
  push:
    branches:
      - "feature/looplift-referral-ladder"
    paths:
      - "experiments/looplift/**"
      - ".github/workflows/looplift-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/looplift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          ANTI_ABUSE_SECRET: ci-only-not-a-production-secret
