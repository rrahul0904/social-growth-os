services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: growthos
      POSTGRES_PASSWORD: growthos
      POSTGRES_DB: growthos
    ports:
      - "5432:5432"
    volumes:
      - growthos_pg:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthos -d growthos"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DEMO_MODE: "false"
      DATABASE_URL: postgres://growthos:growthos@postgres:5432/growthos
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      target: builder
    command: ["npm", "run", "worker"]
    environment:
      DEMO_MODE: "false"
      DATABASE_URL: postgres://growthos:growthos@postgres:5432/growthos
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  growthos_pg:
